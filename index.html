<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5"><meta name="theme-color" content="#1769e0"><link rel="manifest" href="./manifest.json"><link rel="stylesheet" href="./styles.css"><title>JIN Cashbook</title></head><body>
<header><div>👛 <b><i>JIN</i> Cashbook</b><small>บันทึกรายรับ-รายจ่าย อย่างง่าย ใช้ได้ทุกที่</small></div><button id="settings">⚙️</button></header>
<main><div class="periods"><button class="active" data-p="today">วันนี้</button><button data-p="month">เดือนนี้</button><button data-p="year">ปีนี้</button><button data-p="all">ทั้งหมด</button></div>
<div class="cards"><div class="income">🪙<small>รายรับวันนี้</small><strong id="inc">0.00</strong> บาท</div><div class="expense">👛<small>รายจ่ายวันนี้</small><strong id="exp">0.00</strong> บาท</div></div>
<div class="balance">📈 <span>คงเหลือวันนี้<br><strong id="bal">0.00</strong> บาท</span></div>
<div class="quick">
<button data-a="add">➕<b>เพิ่มรายการ</b><small>รายรับ/รายจ่าย</small></button><button data-a="history">🗓️<b>รายวัน / รายเดือน</b></button><button data-a="summary">📊<b>สรุปยอด</b></button><button data-a="search">🔎<b>ค้นหา</b></button>
<button data-a="backup">☁️<b>Backup</b><small>ข้อมูล</small></button><button data-a="restore">♻️<b>Restore</b><small>ข้อมูล</small></button><button data-a="csv">📤<b>ส่งออก</b><small>CSV</small></button><button data-a="print">🖨️<b>พิมพ์รายงาน</b><small>PDF</small></button></div>
<section><h3>📊 รายการล่าสุด</h3><div id="list"></div></section></main>
<button class="fab" data-a="add">＋ เพิ่มรายการ</button><nav><button data-a="home">🏠<small>หน้าหลัก</small></button><button data-a="history">🕘<small>ประวัติ</small></button><button data-a="summary">📊<small>สรุปยอด</small></button><button data-a="settings">⚙️<small>ตั้งค่า</small></button></nav>
<div id="modal" class="hide"><div class="sheet"><b>เพิ่มรายการ</b><button id="close">✕</button><label>ประเภท<select id="type"><option value="expense">รายจ่าย</option><option value="income">รายรับ</option></select></label><label>จำนวนเงิน<input id="amount" type="number" inputmode="decimal" step=".01"></label><label>รายการรายละเอียด<input id="desc"></label><label>หมายเหตุ<textarea id="note"></textarea></label><label>วันที่<input id="date" type="date"></label><button id="save" class="save">💾 บันทึก</button></div></div>
<div id="page" class="hide"><div class="sheet"><b id="ptitle"></b><button id="pclose">✕</button><div id="pbody"></div></div></div>
<input id="file" type="file" accept=".json" hidden><div id="print"></div><script src="app.js"></script></body></html>
